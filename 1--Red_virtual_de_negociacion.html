<!DOCTYPE html>
<html lang="es" class="mov"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Red virtual de negociación</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&display=swap">

<style>
:root{--p:#F3F6F0;--t:#17725C;--u:color-mix(in srgb,#17725C 55%,#fff);--o:#E8573D;--y:#F6B93B;--i:#13241F;--j:#5F6F69;--c:#FFF;--ts:color-mix(in srgb,var(--t) 16%,var(--p));--l:color-mix(in srgb,var(--t) 28%,var(--p))}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--p);color:var(--i);font-family:Geist,Inter,system-ui,sans-serif}
html{transition:background .5s}
#st{position:fixed;left:50%;top:50%;width:1600px;height:900px;overflow:hidden;background:var(--p);transform:translate(-50%,-50%) scale(var(--s,1))}
html.rot #st{transform:translate(-50%,-50%) rotate(90deg) scale(var(--s,1))}
#aura{position:absolute;inset:-260px;pointer-events:none;background:radial-gradient(40% 40% at 16% 24%,var(--ts),transparent 70%),radial-gradient(32% 32% at 88% 80%,color-mix(in srgb,var(--y) 35%,transparent),transparent 70%);animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) rotate(3deg)}}
#prog{position:absolute;top:0;left:0;height:6px;width:0;background:var(--o);transition:width .6s;z-index:5}
#chap{position:absolute;top:36px;left:120px;font-size:22px;color:var(--j);z-index:3}
#deck{position:absolute;inset:0;z-index:1}
.s{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:50px 84px 140px;overflow:hidden;align-items:center}
.s.on{display:flex}
.in{width:100%;display:flex;flex-direction:column;gap:26px}
.in.hs{display:grid;grid-template-columns:1fr 400px;gap:26px 48px;align-items:center}
.in.hs>*{grid-column:1/-1}
.in.hs>h2{grid-column:1;grid-row:1}
.in.hs>.sc{grid-column:2;grid-row:1;width:400px;justify-self:end}
.sc .scn{max-height:none}
.rv{animation:up 1s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
@keyframes up{from{opacity:0;transform:translateY(34px);filter:blur(8px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
@keyframes dash{to{stroke-dashoffset:-48}}
@keyframes flt{50%{transform:translateY(-16px)}}
@keyframes ping{from{transform:scale(.6);opacity:.8}to{transform:scale(2.4);opacity:0}}
@keyframes puff{from{transform:translateY(0) scale(.5);opacity:.8}to{transform:translateY(-90px) scale(1.8);opacity:0}}
@keyframes drive{from{transform:translateX(-260px)}to{transform:translateX(470px)}}
@keyframes belt{from{transform:translateX(0)}to{transform:translateX(480px)}}
.dsh{animation:dash 1.2s linear infinite}
.flt{animation:flt 6s ease-in-out infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite}
.puff{transform-box:fill-box;transform-origin:center;animation:puff 3.6s ease-out infinite}
.bus{animation:drive 11s linear infinite}
.belt{animation:belt 5s linear infinite}
.ft{fill:var(--t)}.fo{fill:var(--o)}.fy{fill:var(--y)}.fts{fill:var(--ts)}.fj{fill:var(--j)}.fi{fill:var(--i)}.fc{fill:var(--c)}.fp{fill:var(--p)}
.st{stroke:var(--t)}.sj{stroke:var(--j)}.sy{stroke:var(--y)}.so{stroke:var(--o)}
.tx{fill:var(--i);font-weight:600;text-anchor:middle}
.tt{fill:var(--p);font-weight:700;text-anchor:middle}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.035em;line-height:1.02}
h1{font-size:150px;letter-spacing:-.05em;max-width:12ch}
h2{font-size:94px;max-width:24ch}
h3{font-size:50px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
p,dl,dd{margin:0}
.sm{font-size:31px;line-height:1.42;color:var(--j)}
.lg{font-size:48px;font-weight:500;line-height:1.2;letter-spacing:-.02em;max-width:36ch}
.box{background:var(--c);border-radius:30px;padding:30px 34px;box-shadow:0 30px 60px -42px rgba(40,20,10,.45)}
.stk{display:grid;gap:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.scn{width:100%;height:auto;max-height:560px;display:block}
.n{display:inline-grid;place-items:center;width:72px;height:72px;border-radius:50%;background:var(--ts);color:var(--t);font-weight:700;font-size:26px}
button{font:inherit;font-weight:600;font-size:30px;color:var(--i);background:var(--c);border:0;border-radius:999px;padding:18px 38px;cursor:pointer;box-shadow:0 14px 28px -20px rgba(0,0,0,.5);transition:transform .3s,background .4s,color .4s}
button:hover{transform:translateY(-2px)}
button:focus-visible{outline:4px solid var(--y);outline-offset:3px}
[aria-pressed=true]{background:var(--t)!important;color:var(--p)!important}
.tabs{display:flex;flex-wrap:wrap;gap:14px}
.pl2{display:grid;gap:30px}
.tab2{animation:pop .6s cubic-bezier(.2,.8,.2,1) var(--d,0s) backwards;transition:transform .5s,box-shadow .5s}
.tab2[aria-pressed=true]{transform:translateY(-4px);box-shadow:0 22px 34px -20px var(--t)}
.tab2{position:relative}
.tab2[aria-pressed=true]::after{content:"";position:absolute;left:18px;right:18px;bottom:7px;height:4px;border-radius:9px;background:var(--y);transform-origin:left;display:none}
.bign{display:block;font-size:150px;font-weight:700;letter-spacing:-.05em;color:var(--t);font-variant-numeric:tabular-nums;line-height:1}
.hp .bar i{animation:none}
.hp.on .bar i{animation:grow 1.5s cubic-bezier(.2,.8,.2,1) both}
.pp{transition:background .5s,color .5s,box-shadow .5s}
.pp.on{background:var(--y);color:var(--i);box-shadow:0 0 0 8px color-mix(in srgb,var(--y) 35%,transparent)}
.ar{align-self:center;font-size:40px;color:var(--t)}
.hw{display:grid}.hp{grid-area:1/1;visibility:hidden;opacity:0}.hp.on{visibility:visible;opacity:1;animation:up .8s cubic-bezier(.2,.8,.2,1) both}
.pn{display:none}
.pn.on{display:block;animation:up .8s cubic-bezier(.2,.8,.2,1) both}
.ln{stroke:var(--j);stroke-width:4;stroke-dasharray:10 12;animation:dash 1.4s linear infinite;fill:none}
.nd{opacity:.45;transition:opacity .6s}
.nd.on{opacity:1}
.nd circle{fill:var(--c);stroke:var(--t);stroke-width:4;transition:all .6s}
.nd.on circle{fill:var(--y);stroke:var(--o);stroke-width:6}
.nd text{font-size:21px;font-weight:600;fill:var(--i);text-anchor:middle}
.cc circle{fill:var(--t);stroke:var(--y);stroke-width:5}
.cc text{font-size:22px;font-weight:700;fill:var(--p);text-anchor:middle}
.hub{width:100%;height:auto;max-height:440px}
.hn{transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.hn.on{transform:translateY(-8px)}
.hcd{fill:var(--c);stroke:var(--l);stroke-width:2;transition:all .5s}
.hn.on .hcd{stroke:var(--t);stroke-width:5}
.hl{fill:var(--i);font-size:20px;font-weight:700;text-anchor:start}
.ct{fill:var(--p);font-size:19px;font-weight:700;text-anchor:middle}
.ch{display:flex;flex-wrap:wrap;align-items:stretch;gap:14px}
.cb{flex:1 1 260px;background:var(--c);border-radius:28px;padding:30px;opacity:.42;transform:scale(.96);transition:all .6s}
.cb.on{opacity:1;transform:scale(1.02);box-shadow:0 0 0 4px var(--t),0 30px 50px -30px var(--t)}
.ch i{align-self:center;font-style:normal;font-size:52px;color:var(--t)}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:26px}
.tl>div{border-top:5px solid var(--l);padding-top:26px;position:relative}
.tl>div:before{content:"";position:absolute;top:-12px;left:0;width:20px;height:20px;border-radius:50%;background:var(--t);box-shadow:0 0 0 8px var(--ts)}
.tl b{display:block;font-size:60px;letter-spacing:-.03em;margin-bottom:10px}
.bar{height:52px;border-radius:99px;background:var(--l);overflow:hidden;margin-top:12px;position:relative}
.bd{position:absolute;left:30%;width:40%;top:0;bottom:0;background:color-mix(in srgb,var(--y) 35%,transparent);border-radius:99px;z-index:2;pointer-events:none}
.bar i{display:block;height:100%;width:var(--w);border-radius:99px;background:var(--t);transform-origin:left;animation:grow 1.5s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.cnt b{display:block;font-size:96px;font-weight:700;letter-spacing:-.04em;color:var(--t);font-variant-numeric:tabular-nums;line-height:1}
.fl3{position:relative;height:320px;perspective:1200px;cursor:pointer}
.fl3>div{position:absolute;inset:0;border-radius:30px;padding:30px;display:flex;flex-direction:column;justify-content:center;gap:14px;backface-visibility:hidden;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.fl3 .f{background:var(--c)}
.fl3 .b{background:var(--t);color:var(--p);transform:rotateY(180deg)}
.fl3.on .f{transform:rotateY(180deg)}
.fl3.on .b{transform:none}
.plot{position:relative;height:470px;border-radius:36px;background:var(--ts)}
.plot span{position:absolute;transform:translate(-50%,-50%);padding:14px 26px;border-radius:99px;background:var(--t);color:var(--p);font-weight:600;font-size:30px;white-space:nowrap;animation:pop .9s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.plot small{position:absolute;font-size:27px;color:var(--j)}
.dl{display:grid;grid-template-columns:1fr 1.5fr;gap:14px 30px}
.dl dt{color:var(--t);font-weight:600;font-size:33px}
.dl dd{font-size:38px;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:16px}
.chip{padding:18px 36px;border-radius:999px;background:var(--ts);color:var(--t);font-size:38px;font-weight:600;animation:pop .8s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.refs{columns:2;column-gap:60px;font-size:29px;color:var(--j);line-height:1.36}
.refs p{break-inside:avoid;margin:0 0 14px}
input[type=range]{width:100%;accent-color:var(--t);height:40px}
nav{position:absolute;bottom:22px;height:88px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px;border-radius:999px;background:var(--c);box-shadow:0 26px 50px -24px rgba(0,0,0,.5);z-index:6}
nav button{background:transparent;box-shadow:none;padding:14px 28px;font-size:30px}
nav button:hover{background:var(--p)}
nav button:disabled{opacity:.3;pointer-events:none}
#pg{position:absolute;left:28px;right:28px;bottom:5px;height:5px;border-radius:9px;background:var(--o);transform-origin:left;transform:scaleX(var(--pr,0));transition:transform .6s}
#n{min-width:420px;text-align:center;color:var(--j);font-size:28px;font-variant-numeric:tabular-nums}
#tp{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);width:1200px;padding:34px;border-radius:40px;background:var(--c);box-shadow:0 50px 90px -30px rgba(0,0,0,.5);z-index:7;display:grid;gap:28px}
#tp[hidden]{display:none}
.modes{display:flex;gap:12px;padding:8px;border-radius:999px;background:var(--p);width:max-content}
.modes button{background:transparent;box-shadow:none;padding:12px 28px;font-size:28px}
.modes [aria-pressed=true]{background:var(--c)!important;color:var(--i)!important;box-shadow:0 10px 20px -14px rgba(0,0,0,.5)}
.pals{display:grid;grid-template-columns:repeat(7,1fr);gap:16px}
.pal{padding:14px;border-radius:26px;background:var(--p);text-align:left;font-size:26px;box-shadow:none}
.pal i{display:flex;height:56px;border-radius:16px;overflow:hidden;margin-bottom:10px}
.pal i b{flex:1}
.pal[aria-pressed=true]{background:var(--p)!important;color:var(--i)!important;outline:4px solid var(--t);outline-offset:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Diagrama de esfera con nodos */
.hz{font-family:Fraunces,Georgia,serif;font-size:28px;fill:var(--p)}
.hd{fill:var(--t);stroke:var(--c);stroke-width:4;transition:fill .5s}
.hn.on .hd{fill:var(--o)}
.hl2{fill:none;stroke:var(--j);stroke-width:2;opacity:.45}
.hl2t{font-family:Geist,sans-serif;font-size:34px;font-weight:600;fill:var(--i);transition:fill .5s}
.hn.on .hl2t{fill:var(--t)}

/* Movimiento fluido, automático e interactivo */
@keyframes slideIn{from{opacity:0;translate:80px 0;filter:blur(8px)}}
@keyframes morph{0%,100%{border-radius:58% 42% 61% 39%/46% 53% 47% 54%}50%{border-radius:42% 58% 37% 63%/55% 44% 56% 45%}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes flow2{to{stroke-dashoffset:-60}}
.s.on>.in{animation:slideIn .9s cubic-bezier(.2,.8,.2,1) both}
#st::before{animation:morph 22s ease-in-out infinite}
.hc{transform-box:fill-box;transform-origin:center;animation:breathe 6s ease-in-out infinite}
.hl2{stroke-dasharray:6 12;animation:flow2 2.4s linear infinite;opacity:.7}
.sc .scn{animation:bob 7s ease-in-out infinite;translate:calc(var(--px,0)*16px) calc(var(--py,0)*10px);transition:translate .8s cubic-bezier(.2,.8,.2,1),scale .6s}
.sc:hover .scn{scale:1.03}
.box,.chip,.cb{transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s}
.box:hover,.chip:hover{transform:translateY(-6px)}
.drag{cursor:grab;user-select:none;touch-action:none}
.dragging{cursor:grabbing!important;transition:none!important}
.hn{cursor:grab}
.hn:hover .hd{fill:var(--o)}

/* Secuencia: primero la explicación, después el ejemplo y su movimiento */
.bus{opacity:0;animation:drive 11s linear 3s infinite,reveal2 .4s 3s both}
@keyframes reveal2{to{opacity:1}}
.belt{animation:belt 5s linear 2.5s infinite}
.puff{animation-delay:2s}

/* Automatismo y realismo */
@keyframes spin{to{transform:rotate(360deg)}}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
.box,.tl>div,.chip,.cb{transition:transform .6s cubic-bezier(.2,.8,.2,1),box-shadow .6s,opacity .6s,background .6s,border-color .6s}
.tl>div:before{transition:transform .6s,background .6s}
.grid>.box:not(.on){opacity:.72}
.box.on{transform:translateY(-6px);box-shadow:0 0 0 4px var(--t),0 30px 50px -30px var(--t)}
.tl>div.on{border-top-color:var(--o)}
.tl>div.on:before{background:var(--o);transform:scale(1.3)}
.chip.on{background:var(--t);color:var(--p);transform:scale(1.06)}

/* Ritmo humano y escenas con profundidad */
.sc{position:relative;isolation:isolate}
.sc::before{content:"";position:absolute;left:8%;right:8%;top:10%;bottom:10%;border-radius:50%;background:radial-gradient(closest-side,var(--ts),transparent 72%);z-index:-1}
.scn{filter:drop-shadow(0 26px 30px rgba(20,22,42,.16))}

/* Barra inferior compacta: pausa, tema y avance */
nav{height:64px;padding:6px 10px;gap:4px;bottom:18px}
nav button{padding:10px 18px;font-size:26px}
#n{display:none}
#pg{left:22px;right:22px;bottom:4px;height:3px}

/* Sin barra de avance en la píldora inferior */
#pg{display:none}

/* Refinamiento de ilustraciones: borde de luz, reflejo suave y etiquetas más legibles */
.scn :is(rect,circle,path)[filter]{stroke:rgba(255,255,255,.55);stroke-width:1.5}
.scn .fc{stroke:rgba(255,255,255,.8);stroke-width:2}
.scn .ft,.scn .fo,.scn .fy{stroke:rgba(255,255,255,.3);stroke-width:1.5}
.scn .tx{font-size:22px;letter-spacing:.01em}
.sc::after{content:"";position:absolute;inset:0;border-radius:36px;pointer-events:none;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.38) 50%,transparent 58%);mix-blend-mode:soft-light;transform:translateX(-120%);animation:glint 8s ease-in-out infinite}
@keyframes glint{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@media (prefers-reduced-motion:reduce){.sc::after{animation:none}}

/* Movimiento sutil por defecto; el completo se activa desde Tema (tecla M) */
html:not(.mov) #aura,html:not(.mov) #st::before,html:not(.mov) .hc,html:not(.mov) .hl2,html:not(.mov) .sc .scn,html:not(.mov) .sc::after,html:not(.mov) .flt,html:not(.mov) .wheel,html:not(.mov) .dsh,html:not(.mov) .puff{animation:none!important}
html:not(.mov) .scn{translate:none!important}
/* Notas del presentador (tecla N) */
#notes{position:absolute;top:34px;right:40px;max-width:560px;z-index:9;background:var(--c);border-radius:24px;padding:22px 28px;font-size:26px;line-height:1.42;color:var(--j);box-shadow:0 22px 44px -26px rgba(0,0,0,.45);opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .4s,transform .4s}
#notes.on{opacity:1;transform:none;pointer-events:auto}
#notes{white-space:pre-line;font-size:28px;line-height:1.5;max-width:640px}
#notes{max-height:600px;overflow:auto;font-size:26px}

/* Selector de tema: más discreto y compacto */
#tp{max-width:min(880px,88vw)!important;padding:12px!important;border-radius:24px!important;background:rgba(255,255,255,.88)!important;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 18px 40px -28px rgba(20,22,42,.35)!important;border:1px solid var(--l)!important}
#tp .modes{gap:6px!important;flex-wrap:wrap;justify-content:center}
#tp .modes button{font-size:22px!important;padding:8px 16px!important;box-shadow:none!important}
#pals{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))!important;gap:8px!important}
#pals .pal{padding:8px!important;font-size:20px!important;border-radius:16px!important;box-shadow:none!important}

/* Sombras suaves, luz y movimiento orgánico */
:root{--shA:color-mix(in srgb,var(--i) 16%,transparent);--shB:color-mix(in srgb,var(--i) 9%,transparent)}
.box{border-radius:38px!important;border:0!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 4px -2px var(--shB),0 22px 44px -26px var(--shA)!important}
.chip{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 14px 28px -20px var(--shA)!important}
nav{background:color-mix(in srgb,var(--c) 78%,transparent)!important;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.55)!important;box-shadow:0 2px 4px -2px var(--shB),0 24px 48px -26px var(--shA)!important}
#tp,#notes{box-shadow:0 2px 4px -2px var(--shB),0 24px 48px -28px var(--shA)!important}
.scn{filter:drop-shadow(0 18px 22px var(--shA)) drop-shadow(0 4px 6px var(--shB))!important}
/* Luz suave desde arriba a la izquierda y grano de papel */
#st::after{content:"";position:absolute;inset:-6%;pointer-events:none;z-index:0;mix-blend-mode:soft-light;opacity:.9;background:radial-gradient(40% 34% at 16% 10%,rgba(255,255,255,.55),transparent 70%),radial-gradient(34% 30% at 90% 95%,color-mix(in srgb,var(--t) 35%,transparent),transparent 72%),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:hueDrift 40s ease-in-out infinite}
@keyframes hueDrift{0%,100%{filter:hue-rotate(0deg)}50%{filter:hue-rotate(12deg)}}
@media (prefers-reduced-motion:reduce){#st::after{animation:none}}
/* Entrada de cada diapositiva: más fluida, sin tocar la escala del ajuste automático */
@keyframes enter{from{opacity:0;translate:0 28px;scale:.982;filter:blur(8px)}}
.s.on>.in{animation:enter 1.1s cubic-bezier(.16,1,.3,1) both}
</style>
<style id="lote1">
.cov,.raw{width:100%;display:flex;flex-direction:column;gap:24px;position:relative}
.ill{position:absolute;right:90px;top:120px;width:640px;height:520px}
.raw .lg{max-width:1250px}
.card{background:var(--c);border-radius:28px;padding:30px;box-shadow:0 22px 44px -30px rgba(20,18,30,.35);display:flex;flex-direction:column;gap:12px;transition:transform .4s,box-shadow .4s}
.card:hover{transform:translateY(-6px);box-shadow:0 30px 56px -28px rgba(20,18,30,.45)}
.row3{display:flex;gap:26px}
.row3>.card{flex:1}
.rt{animation:flow 1.8s linear infinite}
@keyframes flow{to{stroke-dashoffset:-36}}
svg{overflow:visible}
</style>
<style id="lote2">

.cov h1{width:640px;font-size:128px}
.cov .lg{max-width:600px}
.raw svg{display:block;max-width:100%;height:auto}
</style>
<style id="lote3">
.raw .ill{position:absolute;right:0;top:30px;width:460px;height:420px}
.tw{width:860px}

, "html": "<div class=\"raw\"><p class=\"k\">Modelos ágiles · Decisiones y coordinación</p><h2 style=\"font-size:66px\">Infografía: tradicional frente a ágil</h2><div class=\"cmp\"><div></div><div class=\"ph\" style=\"background:var(--t);color:var(--p)\">Tradicional</div><div class=\"ph\" style=\"background:var(--o);color:#fff\">Spotify</div><div class=\"ph\" style=\"background:var(--y);color:var(--i)\">Holacracia</div><div class=\"rl\"><svg class=\"ico\" width=\"62\" height=\"62\" viewBox=\"0 0 40 40\" aria-label=\"Persona\"><defs><radialGradient id=\"hpe\" cx=\".35\" cy=\".3\" r=\".8\"><stop offset=\"0\" style=\"stop-color:color-mix(in srgb, var(--u) 81%, #fff)\"/><stop offset=\"1\" style=\"stop-color:color-mix(in srgb, var(--t) 97%, #000)\"/></radialGradient></defs><circle cx=\"20\" cy=\"12\" r=\"8\" fill=\"url(#hpe)\"/><path d=\"M6 36c0-9 6-13 14-13s14 4 14 13z\" fill=\"url(#hpe)\"/></svg><span>Quién decide</span></div><div class=\"cl\">El jefe de cada nivel</div><div class=\"cl\">Cada squad, dentro de su misión</div><div class=\"cl\">Cada rol, con autoridad definida</div><div class=\"rl\"><svg class=\"ico\" width=\"62\" height=\"62\" viewBox=\"0 0 40 40\" aria-label=\"Flechas\"><defs><linearGradient id=\"har\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\"><stop offset=\"0\" style=\"stop-color:color-mix(in srgb, var(--u) 81%, #fff)\"/><stop offset=\"1\" style=\"stop-color:color-mix(in srgb, var(--t) 97%, #000)\"/></linearGradient></defs><path d=\"M6 14H32L26 8M34 26H8L14 32\" fill=\"none\" stroke=\"url(#har)\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg><span>Cómo se coordina</span></div><div class=\"cl\">Subiendo y bajando por la jerarquía</div><div class=\"cl\">Tribus y guilds transversales</div><div class=\"cl\">Reuniones de gobierno y tácticas</div></div></div>"}, {"c": "Modelos ágiles", "k": "raw", "h": "Infografía: tradicional frente a ágil (2 de 2)", "html": "<div class=\"raw\"><p class=\"k\">Modelos ágiles · Frenos y riesgos</p><h2 style=\"font-size:66px\">Infografía: tradicional frente a ágil</h2><div class=\"cmp\"><div></div><div class=\"ph\" style=\"background:var(--t);color:var(--p)\">Tradicional</div><div class=\"ph\" style=\"background:var(--o);color:#fff\">Spotify</div><div class=\"ph\" style=\"background:var(--y);color:var(--i)\">Holacracia</div><div class=\"rl\"><svg class=\"ico\" width=\"62\" height=\"62\" viewBox=\"0 0 40 40\" aria-label=\"Freno\"><defs><radialGradient id=\"hbr\" cx=\".35\" cy=\".3\" r=\".8\"><stop offset=\"0\" style=\"stop-color:color-mix(in srgb, var(--o) 53%, #fff)\"/><stop offset=\"1\" style=\"stop-color:color-mix(in srgb, var(--o) 93%, #000)\"/></radialGradient></defs><circle cx=\"20\" cy=\"20\" r=\"17\" fill=\"url(#hbr)\"/><rect x=\"11\" y=\"17\" width=\"18\" height=\"6\" rx=\"3\" fill=\"#fff\"/></svg><span>Qué la frena</span></div><div class=\"cl\">Cada decisión espera su turno</div><div class=\"cl\">Mantener la alineación entre squads</div><div class=\"cl\">Tiempo en reuniones y ajuste de roles</div><div class=\"rl\"><svg class=\"ico\" width=\"62\" height=\"62\" viewBox=\"0 0 40 40\" aria-label=\"Riesgo\"><defs><linearGradient id=\"hwa\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" style=\"stop-color:color-mix(in srgb, var(--y) 18%, #fff)\"/><stop offset=\"1\" style=\"stop-color:color-mix(in srgb, var(--y) 88%, #fff)\"/></linearGradient></defs><path d=\"M20 4L37 34H3Z\" fill=\"url(#hwa)\" stroke-width=\"1.5\" style=\"stroke:color-mix(in srgb, var(--y) 86%, #000)\"/><rect x=\"18.5\" y=\"14\" width=\"3\" height=\"11\" rx=\"1.5\" style=\"fill:color-mix(in srgb, var(--j) 37%, #000)\"/><circle cx=\"20\" cy=\"29\" r=\"2\" style=\"fill:color-mix(in srgb, var(--j) 37%, #000)\"/></svg><span>Riesgo</span></div><div class=\"cl\">Poca iniciativa</div><div class=\"cl\">Autonomía sin reglas comunes</div><div class=\"cl\">Confusión si los roles se solapan</div></div><p class=\"src2\">Tradicional: las decisiones suben y las órdenes bajan. Ágil: las decisiones se toman cerca del trabajo, con reglas de coordinación explícitas.</p></div>"}, {"c": "Riesgos", "k": "raw", "h": "Riesgos en entornos virtuales", "html": "<div class=\"raw wv\"><p class=\"k\">Riesgos</p><h2 class=\"tw\">Riesgos en entornos virtuales</h2><div class=\"tg\"><div class=\"tabs\"><button data-tab=\"a\" aria-pressed=\"true\">Control</button><button data-tab=\"b\" aria-pressed=\"false\">Comunicación</button><button data-tab=\"c\" aria-pressed=\"false\">Cultura</button></div><div class=\"box tp2 on\" data-p=\"a\"><p class=\"k\">¿Cómo se supervisa a quien no controlas?</p><p class=\"lg\">Acuerdos con métricas claras, revisiones periódicas y calificación. Sin ellos, el retraso se descubre tarde.</p></div><div class=\"box tp2\" data-p=\"b\"><p class=\"k\">¿Qué pasa cuando un mensaje se pierde?</p><p class=\"lg\">Sin registro, el aviso se queda a medio camino. Con registro, queda con fecha y responsable.</p></div><div class=\"box tp2\" data-p=\"c\"><p class=\"k\">¿Cómo se alinean formas distintas de trabajar?</p><p class=\"lg\">Confianza, transparencia y avisar los errores a tiempo: valores que el equipo propone para la red.</p></div></div><p class=\"src2\">Los tres riesgos se atienden con la misma base: acuerdos escritos y reputación.</p>\n<svg class=\"ill\" viewBox=\"0 0 460 420\" aria-label=\"Tres riesgos: control, comunicación y cultura\"><defs><filter id=\"fbR\" x=\"-40%\" y=\"-40%\" width=\"180%\" height=\"180%\"><feGaussianBlur stdDeviation=\"6\"/></filter><filter id=\"fsR\" x=\"-30%\" y=\"-30%\" width=\"160%\" height=\"170%\"><feDropShadow dx=\"0\" dy=\"6\" stdDeviation=\"5\" flood-opacity=\".28\" style=\"flood-color:color-mix(in srgb, var(--t) 40%, #000)\"/></filter><radialGradient id=\"rd\" cx=\".35\" cy=\".3\" r=\".8\"><stop offset=\"0\" style=\"stop-color:#fff\"/><stop offset=\"1\" style=\"stop-color:color-mix(in srgb, var(--t) 24%, #fff)\"/></radialGradient><radialGradient id=\"ra\" cx=\".35\" cy=\".3\" r=\".8\"><stop offset=\"0\" style=\"stop-color:color-mix(in srgb, var(--y) 40%, #fff)\"/><stop offset=\"1\" style=\"stop-color:color-mix(in srgb, var(--o) 93%, #000)\"/></radialGradient><radialGradient id=\"rp\" cx=\".35\" cy=\".3\" r=\".8\"><stop offset=\"0\" style=\"stop-color:color-mix(in srgb, var(--u) 81%, #fff)\"/><stop offset=\"1\" style=\"stop-color:color-mix(in srgb, var(--t) 97%, #000)\"/></radialGradient><linearGradient id=\"re\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" style=\"stop-color:#fff\"/><stop offset=\"1\" style=\"stop-color:color-mix(in srgb, var(--t) 14%, #fff)\"/></linearGradient></defs><circle cx=\"110\" cy=\"110\" r=\"66\" fill=\"url(#rd)\" stroke-width=\"3\" style=\"stroke:color-mix(in srgb, var(--t) 39%, #fff)\"/><path d=\"M110 110L146 80\" stroke-width=\"6\" stroke-linecap=\"round\" style=\"stroke:color-mix(in srgb, var(--t) 97%, #000)\"/><circle cx=\"110\" cy=\"110\" r=\"8\" style=\"fill:color-mix(in srgb, var(--t) 97%, #000)\"/><path d=\"M60 110a50 50 0 0 1 100 0\" fill=\"none\" stroke-width=\"6\" opacity=\".7\" style=\"stroke:color-mix(in srgb, var(--o) 93%, #000)\"/><rect x=\"58\" y=\"222\" width=\"104\" height=\"72\" rx=\"10\" fill=\"url(#re)\" stroke-width=\"2\" style=\"stroke:color-mix(in srgb, var(--t) 39%, #fff)\"/><path d=\"M58 230L110 262L162 230\" fill=\"none\" stroke-width=\"4\" style=\"stroke:color-mix(in srgb, var(--o) 93%, #000)\"/><circle cx=\"110\" cy=\"346\" r=\"0\" fill=\"none\"/><circle cx=\"90\" cy=\"356\" r=\"22\" fill=\"url(#rp)\"/><circle cx=\"134\" cy=\"356\" r=\"22\" fill=\"url(#ra)\"/><path d=\"M60 404c0-20 12-30 30-30s30 10 30 30z\" fill=\"url(#rp)\"/><path d=\"M104 404c0-20 12-30 30-30s30 10 30 30z\" fill=\"url(#ra)\"/><text x=\"230.0\" y=\"124.0\" text-anchor=\"start\" font-family=\"Geist,Inter,sans-serif\" font-size=\"26\" font-weight=\"700\" style=\"fill:var(--i)\">Control</text><text x=\"230.0\" y=\"254.0\" text-anchor=\"start\" font-family=\"Geist,Inter,sans-serif\" font-size=\"26\" font-weight=\"700\" style=\"fill:var(--i)\">Comunicación</text><text x=\"230.0\" y=\"384.0\" text-anchor=\"start\" font-family=\"Geist,Inter,sans-serif\" font-size=\"26\" font-weight=\"700\" style=\"fill:var(--i)\">Cultura</text></svg></div>"}, {"c": "Cierre", "k": "raw", "h": "Lo que deja este tema", "html": "<div class=\"raw wv\"><p class=\"k\">Cierre</p><h2 class=\"tw\">Lo que deja este tema</h2><div class=\"tg\"><div class=\"tabs\"><button data-tab=\"a\" aria-pressed=\"true\">Qué es</button><button data-tab=\"b\" aria-pressed=\"false\">Cómo opera</button><button data-tab=\"c\" aria-pressed=\"false\">Qué la sostiene</button><button data-tab=\"d\" aria-pressed=\"false\">Qué cambia y qué riesgo tiene</button></div><div class=\"box tp2 on\" data-p=\"a\"><p class=\"lg\">Empresas independientes que trabajan juntas por medios digitales y contratos, sin ser dueñas unas de otras.</p></div><div class=\"box tp2\" data-p=\"b\"><p class=\"lg\">Un centro conserva lo que define su valor y coordina a socios que hacen el trabajo. Cada pedido arma una cadena distinta: se busca, se acuerda, se entrega y se califica.</p></div><div class=\"box tp2\" data-p=\"c\"><p class=\"lg\">Acuerdos escritos, reputación que se gana al cumplir y una plataforma que reúne datos. Sin eso, la red se rompe en el primer atraso.</p></div><div class=\"box tp2\" data-p=\"d\"><p class=\"lg\">La agilidad global depende de coordinar sin perder control. Los modelos ágiles ayudan, pero no se copian: el reto está en la confianza y en las reglas claras.</p></div></div><p class=\"src2\">La tecnología ayuda, pero no decide. Lo que decide es quién coordina y cómo se cumplen los acuerdos.</p>\n<svg class=\"ill\" viewBox=\"0 0 460 420\" aria-label=\"Una red con cuatro puntos de conclusión alrededor de su centro\"><defs><filter id=\"fbR\" x=\"-40%\" y=\"-40%\" width=\"180%\" height=\"180%\"><feGaussianBlur stdDeviation=\"6\"/></filter><filter id=\"fsR\" x=\"-30%\" y=\"-30%\" width=\"160%\" height=\"170%\"><feDropShadow dx=\"0\" dy=\"6\" stdDeviation=\"5\" flood-opacity=\" fill:color-mix(in srgb, var(--t) 40%, #000)\"/><circle cx=\"340\" cy=\"128\" r=\"36\" stroke-width=\"3\" style=\"fill:color-mix(in srgb, var(--y) 18%, #fff);stroke:color-mix(in srgb, var(--y) 88%, #fff)\"/></g><text x=\"340.0\" y=\"138.0\" text-anchor=\"middle\" font-family=\"Geist,Inter,sans-serif\" font-size=\"30\" font-weight=\"700\" style=\"fill:var(--i)\">2</text><g class=\"hv\"><ellipse cx=\"120\" cy=\"340\" rx=\"46\" ry=\"14\" opacity=\".2\" filter=\"url(#fbR)\" style=\"fill:color-mix(in srgb, var(--t) 40%, #000)\"/><circle cx=\"120\" cy=\"300\" r=\"36\" stroke-width=\"3\" style=\"fill:#fff;stroke:color-mix(in srgb, var(--t) 39%, #fff)\"/></g><text x=\"120.0\" y=\"310.0\" text-anchor=\"middle\" font-family=\"Geist,Inter,sans-serif\" font-size=\"30\" font-weight=\"700\" style=\"fill:var(--i)\">3</text><g class=\"hv\"><ellipse cx=\"340\" cy=\"340\" rx=\"46\" ry=\"14\" opacity=\".2\" filter=\"url(#fbR)\" style=\"fill:color-mix(in srgb, var(--t) 40%, #000)\"/><circle cx=\"340\" cy=\"300\" r=\"36\" stroke-width=\"3\" style=\"fill:#fff;stroke:color-mix(in srgb, var(--t) 39%, #fff)\"/></g><text x=\"340.0\" y=\"310.0\" text-anchor=\"middle\" font-family=\"Geist,Inter,sans-serif\" font-size=\"30\" font-weight=\"700\" style=\"fill:var(--i)\">4</text><g class=\"hv\"><circle cx=\"230\" cy=\"210\" r=\"62\" fill=\"url(#cs2)\"/><ellipse cx=\"208\" cy=\"186\" rx=\"22\" ry=\"10\" fill=\"#fff\" opacity=\".5\"/></g><text x=\"230.0\" y=\"218.0\" text-anchor=\"middle\" font-family=\"Geist,Inter,sans-serif\" font-size=\"24\" font-weight=\"700\" style=\"fill:#fff\">Red</text></svg></div>"}, {"c": "Cierre", "k": "raw", "h": "Conclusión del equipo", "html": "<div class=\"raw wv\" style=\"grid-template-columns:.95fr 1.05fr\"><p class=\"k\">Conclusión final</p><h2>Conclusión del equipo</h2><p class=\"lg\" style=\"font-size:32px;line-height:1.36\">Concluimos que una red virtual de negocios funciona cuando el núcleo sabe qué conservar y qué confiar. Lo que la sostiene no es la tecnología, sino tres decisiones: quién coordina, cómo se registra cada acuerdo y qué se hace cuando un socio falla. Los modelos ágiles aportan autonomía, pero solo funcionan con reglas claras.</p><svg class=\"ill\" viewBox=\"-527 -319 930 667\" aria-label=\"Red que coordina, registra y corrige acuerdos\"><polygon points=\"-374.1,174.0 249.4,174.0 384.5,252.0 249.4,330.0 -374.1,330.0 -509.2,252.0\" style=\"fill:color-mix(in srgb, var(--t) 14%, var(--p))\"/><line class=\"ln\" x1=\"-62.4\" y1=\"-255.0\" x2=\"-374.1\" y2=\"27.0\"/><line class=\"ln\" x1=\"-62.4\" y1=\"-255.0\" x2=\"-62.4\" y2=\"-63.0\"/><line class=\"ln\" x1=\"-62.4\" y1=\"-255.0\" x2=\"249.4\" y2=\"57.0\"/><polygon points=\"-311.8,252.0 -374.1,288.0 -374.1,63.0 -311.8,27.0\" style=\"fill:color-mix(in srgb, var(--t) 72%, #000)\"/><polygon points=\"-436.5,252.0 -374.1,288.0 -374.1,63.0 -436.5,27.0\" style=\"fill:var(--t)\"/><polygon points=\"-427.1,227.4 -411.5,236.4 -411.5,210.0 -427.1,201.0\" style=\"fill:#fff;fill-opacity:.5\"/><polygon points=\"-321.1,227.4 -336.7,236.4 -336.7,210.0 -321.1,201.0\" style=\"fill:#fff;fill-opacity:.35\"/><polygon points=\"-399.1,243.6 -383.5,252.6 -383.5,226.2 -399.1,217.2\" style=\"fill:#fff;fill-opacity:.5\"/><polygon points=\"-349.2,243.6 -364.8,252.6 -364.8,226.2 -349.2,217.2\" style=\"fill:#fff;fill-opacity:.35\"/><polygon points=\"-427.1,173.4 -411.5,182.4 -411.5,156.0 -427.1,147.0\" style=\"fill:#fff;fill-opacity:.5\"/><polygon points=\"-321.1,173.4 -336.7,182.4 -336.7,156.0 -321.1,147.0\" style=\"fill:#fff;fill-opacity:.35\"/><polygon points=\"-399.1,189.6 -383.5,198.6 -383.5,172.2 -399.1,163.2\" style=\"fill:#fff;fill-opacity:.5\"/><polygon points=\"-349.2,189.6 -364.8,198.6 -364.8,172.2 -349.2,163.2\" style=\"fill:#fff;fill-opacity:.35\"/><polygon points=\"-427.1,119.4 -411.5,128.4 -411.5,102.0 -427.1,93.0\" style=\"fill:#fff;fill-opacity:.5\"/><polygon points=\"-321.1,119.4 -336.7,128.4 -336.7,102.0 -321.1,93.0\" style=\"fill:#fff;fill-opacity:.35\"/><polygon points=\" const sh=(el,k)=>{el.querySelectorAll("[data-j]").forEach(x=>{x.classList.toggle("on",+x.dataset.j===k);if(x.tagName==="BUTTON")x.setAttribute("aria-pressed",String(+x.dataset.j===k))});el.querySelectorAll(".pn2").forEach((g,n)=>{g.style.transform=`translate(${PY[k][n][0]}px,${PY[k][n][1]}px)`});const l=el.querySelector(".pl");if(l)l.style.opacity=k===2?1:0};
const loop=(el,n,ms)=>{let k=0;sh(el,0);L.push(setInterval(()=>sh(el,k=(k+1)%n),ms))};
const tick=b=>{const to=+b.dataset.to,t0=performance.now();const f=t=>{const p=Math.min(1,(t-t0)/1800),e=1-Math.pow(1-p,3);b.textContent=b.dataset.pre+Math.round(to*e).toLocaleString("en-US")+b.dataset.suf;if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)};
function dwell(d){let w=Math.max(12000,JSON.stringify(d).length*38);if(d.k==="cyc"||d.k==="hub"||d.k==="pyr"||d.k==="list"||d.k==="tl"||d.k==="nest"||d.k==="bars"||d.k==="flip"||d.k==="plot"||d.k==="count")w=Math.max(w,d.i.length*4200+2000);return Math.min(w,44000)}
function clr(){T.forEach(clearTimeout);L.forEach(clearInterval);T=[];L=[];clearTimeout(A)}
function run(el,d){
  const k=d.k;
  if(k==="cyc"||k==="hub"||k==="pyr"||k==="list"||k==="tl"||k==="nest"||k==="bars"||k==="flip"||k==="plot"||k==="count")loop(el,d.i.length,4200);
  if(k==="chain")loop(el,d.n.length,1900);
  if(k==="count")el.querySelectorAll("[data-to]").forEach((b,j)=>at(()=>tick(b),500+j*400));
  if(k==="flip")el.querySelectorAll("[data-fl]").forEach((f,j)=>at(()=>f.classList.add("on"),1200+j*1100));
  if(k==="slider")loop(el,5,800);
}
let TOT=0;
function seq(el,H){let k=0;const st=()=>{sh(el,k);T.push(setTimeout(()=>{k=(k+1)%H.length;st()},H[k]))};st()}
function run2(el,d){
const W=s=>(s||'').trim().split(/\s+/).filter(Boolean).length,PLS=[...el.querySelectorAll('.tab2,.pp,.hn')];
if(d.k==='pyr')el.querySelectorAll('.pn2').forEach((g,n)=>{g.style.transform=`translate(${PY[0][n][0]}px,${PY[0][n][1]}px)`});
if(d.k==='slider')loop(el,5,900);
if(d.k==='count')el.querySelectorAll('[data-to]').forEach((b,j)=>at(()=>tick(b),1200+j*500));
if(d.k==='refs')return 30000;
if(PLS.length&&el.querySelector('.hp')){
const DT=el.querySelectorAll('.hp');
const H=PLS.map((b,j)=>{const x=DT[j];return Math.min(18000,Math.max(4200,2000+W(b.textContent+' '+(x?x.textContent:''))*460))});
at(()=>seq(el,H),1200);
const f=W([...el.querySelectorAll('.sm')].filter(x=>!x.closest('.hp')&&!x.closest('.pl2')).map(x=>x.textContent).join(' '));
return 1200+H.reduce((a,b)=>a+b,0)+3000+f*460;
}
const AI=[...new Set([...el.querySelectorAll('[data-j]')].map(x=>x.dataset.j))];if(AI.length){const H2=AI.map(v=>{const x=el.querySelector('[data-j="'+v+'"]');return Math.min(18000,Math.max(4200,2000+W(x.textContent)*460))});at(()=>seq(el,H2),1200);return 1200+H2.reduce((a,b)=>a+b,0)+3000}
return Math.max(14000,3000+W(el.textContent)*460);
}
function fit(s){const c=s.firstElementChild,T=690,up=c.querySelector(".cov")?30:(c.querySelector(".cmp")?35:10);let k=1;const ap=()=>{c.style.position="absolute";c.style.left="50%";c.style.top="50%";c.style.transform="translate(-50%,calc(-50% - "+up+"px)) scale("+k+")"};const H=()=>{c.style.width=(1432/k)+"px";ap();return c.offsetHeight};for(let n=0;n<8;n++){const h=H();k=Math.max(.5,Math.min(1,(k+T/h)/2))}while(k>.5&&H()*k>T)k=Math.max(.5,k-.01);c.style.width=(1432/k)+"px";ap()}
function size(){const W=innerWidth,H=innerHeight,ph=H>W&&Math.min(W,H)<640;document.documentElement.classList.toggle("rot",ph);document.documentElement.style.setProperty("--s",ph?Math.min(H/1600,W/900):Math.min(W/1600,H/900))}
function dwellOf(){return TOT||12000}
function th(){const dk=mode==="dark"||(mode==="system"&&matchMedia("(prefers-color-scheme: dark)").matches),P=PAL[pi],t=dk?P[4]:P[3],s=document.documentElement.style;
s.setProperty("--p",dk?P[2]:P[1]);s.setProperty("--t",t);s.setProperty("--u",`color-mix(in srgb,${t} 55%,#fff)`);s.setProperty("--o",P[5]);s.setProperty("--y",P[6]);s.setProperty("--i",dk?"#FFF3EA":(P[7]||"#1F1B2D"));s.setProperty("--j",dk?"#B9B0C6":(P[8]||"#5E5669"));s.setProperty("--c",dk?"color-mix(in srgb,#fff 9%,var(--p))":"#FFFFFF");
document.querySelectorAll("[data-m]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.m===mode)));
document.querySelectorAll("[data-pi]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.pi===pi)));
try{localStorage.setItem("rvn2",JSON.stringify([mode,pi]))}catch(e){}}
function go(n){
  clr();
  i=Math.max(0,Math.min(D.length-1,n));
  SL.forEach((s,k)=>s.classList.toggle("on",k===i));
  const d=D[i],el=SL[i];
  TOT=run2(el,d);
  fit(el);
  
  $("n").textContent=d.c+" · "+(i+1)+" / "+D.length;
  $("pg").style.setProperty("--pr",(i+1)/D.length);
  $("pv").disabled=i===0;$("nx").disabled=i===D.length-1;
  if(auto)A=setTimeout(()=>{if(i<D.length-1)go(i+1)},TOT);
}
$("pa").onclick=()=>{if(auto){auto=false;clr();$("pa").textContent="▶";$("pa").setAttribute("aria-label","Reanudar")}else{auto=true;$("pa").textContent="❚❚";$("pa").setAttribute("aria-label","Pausar");go(i)}};
$("pv").onclick=()=>go(i-1);$("nx").onclick=()=>go(i+1);
$("th").onclick=e=>{e.stopPropagation();$("tp").hidden=!$("tp").hidden};
$("pals").innerHTML=PAL.map((P,k)=>`<button class="pal" data-pi="${k}" aria-pressed="false"><i><b style="background:${P[1]}"></b><b style="background:${P[3]}"></b><b style="background:${P[5]}"></b><b style="background:${P[6]}"></b></i>${P[0]}</button>`).join("");
$("tp").addEventListener("click",e=>{const m=e.target.closest("[data-m]"),p=e.target.closest("[data-pi]");if(m)mode=m.dataset.m;if(p)pi=+p.dataset.pi;if(m||p)th()});
document.addEventListener("click",e=>{if(!e.target.closest("#tp,#th"))$("tp").hidden=true});
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();go(i+1)}
  else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(i-1)}
  else if(e.key==="p"||e.key==="P")$("pa").click();
});
let x0=0,y0=0;
deck.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
deck.addEventListener("touchend",e=>{if(e.target.closest("input"))return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)go(dx<0?i+1:i-1)},{passive:true});
deck.addEventListener("click",e=>{
  const f=e.target.closest(".fl3");if(f){f.classList.toggle("on");return}
  const t=e.target.closest("[data-j]");if(!t)return;
  L.forEach(clearInterval);L=[];
  sh(t.closest(".s"),+t.dataset.j);
});
addEventListener("resize",size);
size();th();go(0);
document.fonts&&document.fonts.ready.then(()=>fit(SL[i]));

/* Movimiento: el fondo responde al cursor; las piezas se arrastran y regresan con resorte */
(()=>{const root=document.documentElement,SEL='.hn,.sc,.box,.chip,.cb';
addEventListener('pointermove',e=>{root.style.setProperty('--px',(e.clientX/innerWidth*2-1).toFixed(3));root.style.setProperty('--py',(e.clientY/innerHeight*2-1).toFixed(3))},{passive:true});
document.querySelectorAll(SEL).forEach(el=>el.classList.add('drag'));
let cur=null,sx=0,sy=0,ox=0,oy=0;
const pos=(el,e)=>{if(el.ownerSVGElement){const s=el.ownerSVGElement,p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(s.getScreenCTM().inverse())}return{x:e.clientX,y:e.clientY}};
const curve=(bx,by)=>`M300,175 Q${(300+(bx-300)*.2).toFixed(1)},${(175+(by-175)*.8).toFixed(1)} ${bx.toFixed(1)},${by.toFixed(1)}`;
document.addEventListener('pointerdown',e=>{const el=e.target.closest(SEL);if(!el||e.target.closest('nav,#mapa,#tp'))return;cur=el;el.classList.add('dragging');const p=pos(el,e);sx=p.x;sy=p.y;ox=+(el.dataset.ox||0);oy=+(el.dataset.oy||0);if(el.classList.contains('hn')&&!el.dataset.bx){const c=el.querySelector('circle');el.dataset.bx=c.getAttribute('cx');el.dataset.by=c.getAttribute('cy')}});
document.addEventListener('pointermove',e=>{if(!cur)return;const p=pos(cur,e),X=ox+p.x-sx,Y=oy+p.y-sy;cur.dataset.ox=X;cur.dataset.oy=Y;cur.style.transform=`translate(${X}px,${Y}px)`;if(cur.classList.contains('hn'))cur.ownerSVGElement.querySelectorAll('.hl2')[+cur.dataset.j].setAttribute('d',curve(+cur.dataset.bx+X,+cur.dataset.by+Y))});
document.addEventListener('pointerup',()=>{if(!cur)return;const el=cur;cur=null;el.classList.remove('dragging');el.style.transition='transform .8s cubic-bezier(.34,1.56,.64,1)';el.style.transform='translate(0px,0px)';el.dataset.ox=0;el.dataset.oy=0;if(el.classList.contains('hn'))el.ownerSVGElement.querySelectorAll('.hl2')[+el.dataset.j].setAttribute('d',curve(+el.dataset.bx,+el.dataset.by));setTimeout(()=>el.style.transition='',850)});
})();

addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="Home"){e.preventDefault();go(0)}else if(e.key==="End"){e.preventDefault();go(D.length-1)}else if(e.key==="t"||e.key==="T")$("th").click()});

(()=>{const root=document.documentElement,mb=document.createElement('button');
const lab=()=>{const on=root.classList.contains('mov');mb.textContent=on?'Movimiento':'Movimiento';mb.setAttribute('aria-pressed',String(on))};
mb.onclick=e=>{e.stopPropagation();root.classList.toggle('mov');lab()};
document.querySelector('#tp .modes').appendChild(mb);lab();
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='m'||e.key==='M')mb.click();});
})();

/* Un solo botón de movimiento en el selector de tema */
(()=>{const bs=[...document.querySelectorAll('#tp .modes button')].filter(x=>/^Movimiento/.test(x.textContent));bs.slice(1).forEach(x=>x.remove())})();
</script>

document.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;const g=b.closest('.tg');if(!g)return;g.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));g.querySelectorAll('.tp2').forEach(p=>p.classList.toggle('on',p.dataset.p===b.dataset.tab))});
</script>

document.addEventListener('click',e=>{const t=e.target.closest('svg .hv,svg .pulse');if(t)t.classList.toggle('sel')});
